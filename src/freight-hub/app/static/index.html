<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>货代询价助手 FreightHub</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/app.css?v=11">
<style>
#boot{position:fixed;inset:0;z-index:99999;background:#f3f3f3;display:flex;flex-direction:column;align-items:center;justify-content:center;font:14px "Segoe UI","Microsoft YaHei",sans-serif;color:#444;transition:opacity .25s}
#boot.hide{opacity:0;pointer-events:none}
#boot .sp{width:38px;height:38px;border:4px solid #d6e4f5;border-top-color:#0f6cbd;border-radius:50%;animation:bsp .8s linear infinite;margin-bottom:16px}
@keyframes bsp{to{transform:rotate(360deg)}}
#boot .t2{margin-top:6px;font-size:12px;color:#888}
</style>
</head>
<body>
<div id="boot"><div class="sp"></div><div id="bootMsg">正在加载…</div><div class="t2" id="bootSub">货代询价助手 FreightHub</div></div>
<div id="app">
  <div id="titlebar" class="pywebview-drag-region">
    <svg class="app-ico" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="4" fill="#0f6cbd"/><path d="M6 15.5V9l6-3 6 3v6.5l-6 3z M6 9l6 3 6-3 M12 12v6.5" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <span id="winTitle">货代询价助手 FreightHub</span>
    <span id="winSub"></span>
    <div id="winCtl">
      <button id="wMin" title="最小化"><svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"/></svg></button>
      <button id="wMax" title="最大化"><svg viewBox="0 0 10 10" id="icMax"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
      <button id="wClose" title="关闭"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></button>
    </div>
  </div>
  <div id="menubar"></div>
  <div id="toolbar"></div>
  <div id="main">
    <div id="nav"><div class="pane-title">导航</div><div id="tree"></div></div>
    <div id="vsplit"></div>
    <div id="work">
      <div id="tabs"></div>
      <div id="tabbody"></div>
    </div>
  </div>
  <div id="statusbar">
    <span id="sbMsg" class="sb-seg grow">就绪</span>
    <span id="sbPlats" class="sb-seg"></span>
    <span id="sbTime" class="sb-seg">耗时：-</span>
    <span id="sbCount" class="sb-seg">记录：0</span>
    <span id="sbVer" class="sb-seg"></span>
  </div>
</div>
<div id="menuLayer"></div>
<div id="ctxmenu" class="menu-pop" style="display:none"></div>
<div id="modal" style="display:none"></div>
<datalist id="countryList"></datalist>
<script src="/static/trial.js?v=1"></script>
<script src="/static/app.js?v=12"></script>
</body>
</html>
