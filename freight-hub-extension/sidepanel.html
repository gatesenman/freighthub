<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>货代询价助手 FreightHub</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/panel.css">
</head>
<body>
<div id="app">
  <header id="hd">
    <img src="icons/icon32.png" alt="" class="logo">
    <span class="ti">货代询价助手</span>
    <span id="hdBadge"></span>
    <span class="sp"></span>
    <button id="btnUser" class="hbtn" title="" hidden></button>
    <button id="btnOpts" class="hbtn" title="设置（后端、快捷键）">⚙</button>
  </header>
  <div id="conn" class="conn"><span id="connDot" class="dot"></span><span id="connTxt">正在连接…</span></div>

  <!-- 登录（网页版需要登录；已在浏览器里登录过网页版时会直接沿用站点会话） -->
  <section id="vLogin" hidden>
    <form id="fLogin" class="card" autocomplete="on">
      <div class="card-t">登录网页版</div>
      <label>用户名<input id="liUser" name="username" autocomplete="username" required></label>
      <label>密码<input id="liPass" name="password" type="password" autocomplete="current-password" required></label>
      <label class="cb"><input id="liRemember" type="checkbox">保持登录（30 天，仅保存站点会话，不保存密码）</label>
      <div id="liMsg" class="msg" role="alert"></div>
      <button class="primary" id="liGo" type="submit">登录</button>
    </form>
  </section>

  <section id="vMain" hidden>
    <form id="qf" autocomplete="off">
      <input id="qText" class="qtext" placeholder="快速输入：美国 2kg 30x20x10，回车查询" title="国家 重量 [长x宽x高]；在网页上选中「US 1kg」右键也可以">
      <div class="r1">
        <label>目的国<input id="inCountry" list="countryList" placeholder="美国 / US"></label>
        <label class="w">重量 kg<input id="inWeight" type="number" min="0" step="0.01" placeholder="1"></label>
        <button id="bGo" class="primary" type="submit">查询</button>
      </div>
      <div class="r2"><span>尺寸 cm（可选）</span><input id="inL" type="number" min="0" placeholder="长"><i>×</i><input id="inW" type="number" min="0" placeholder="宽"><i>×</i><input id="inH" type="number" min="0" placeholder="高"></div>
    </form>
    <datalist id="countryList"></datalist>
    <nav id="tabs">
      <button data-tab="quick" class="on">各平台最低价</button>
      <button data-tab="all">全部结果 <b id="cntAll">0</b></button>
      <button data-tab="hist">历史</button>
    </nav>
    <div id="pQuick" class="pane">
      <div id="qbest" class="best idle">输入目的国和重量，按 Enter 查询各平台最低价</div>
      <div id="qlist"></div>
      <div id="qmore" class="more"></div>
    </div>
    <div id="pAll" class="pane" hidden>
      <div class="filters"><input id="fKey" placeholder="筛选：渠道 / 备注 / 平台"><select id="fPlat"><option value="">全部平台</option></select></div>
      <div class="gridwrap"><table id="grid"><thead><tr>
        <th data-k="platform_name">平台</th><th data-k="channel">渠道</th><th data-k="total" class="num">总价 ¥</th><th data-k="days_min" class="num">时效(天)</th></tr></thead><tbody></tbody></table></div>
      <div id="gridNote" class="more"></div>
    </div>
    <div id="pHist" class="pane" hidden>
      <div class="filters"><span class="muted" id="histNote"></span><span class="sp"></span><button id="btnHistRefresh" class="link">刷新</button></div>
      <div id="histList"></div>
    </div>
  </section>
  <div id="fatal" class="fatal" hidden></div>
  <footer id="ft"><span id="ftL">v1.0.1</span><span class="sp"></span><span class="muted">只读查询 · 不会下单</span></footer>
</div>
<script src="js/settings.js"></script>
<script src="js/parse.js"></script>
<script src="js/trial.js"></script>
<script src="js/panel.js"></script>
</body>
</html>
